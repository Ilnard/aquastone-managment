# nginx для AquaStone: система управления, конструктор и API на одном домене.
# Один домен нужен, чтобы cookie входа работала и в конструкторе (менеджер отправляет заявку без формы).
# Замените crm.aquastone.ru на свой домен. Сертификат — certbot (см. DEPLOY.md).
#
#   https://crm.aquastone.ru/              — система управления (aquastone-managment/dist)
#   https://crm.aquastone.ru/constructor/  — конструктор столешниц (aquastone-constructor/dist)
#   https://crm.aquastone.ru/api/          — сервер (Node.js на 127.0.0.1:3001)

server {
  listen 80;
  server_name crm.aquastone.ru;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name crm.aquastone.ru;

  ssl_certificate     /etc/letsencrypt/live/crm.aquastone.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/crm.aquastone.ru/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Вложения процессов — до 50 МБ.
  client_max_body_size 55m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    # Сервер доверяет этому заголовку только от прокси на этой же машине (trust proxy = loopback).
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Собранные файлы с хэшем в имени можно кэшировать надолго.
  location /assets/ {
    root /var/www/aquastone/management;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location /constructor/assets/ {
    alias /var/www/aquastone/constructor/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /constructor/ {
    alias /var/www/aquastone/constructor/;
    try_files $uri $uri/ /constructor/index.html;
  }

  location / {
    root /var/www/aquastone/management;
    try_files $uri /index.html;
  }
}
